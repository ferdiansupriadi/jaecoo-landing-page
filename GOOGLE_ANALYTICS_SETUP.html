<!-- 
GOOGLE ANALYTICS 4 SETUP GUIDE
Tambahkan code ini sebelum closing </head> tag di semua HTML files

Langkah:
1. Login ke Google Analytics (https://analytics.google.com)
2. Buat property baru untuk website Anda
3. Google akan memberikan ID seperti: G-XXXXXXXXXX
4. Ganti MEASUREMENT_ID dengan ID Anda
5. Paste code di bawah ke setiap halaman HTML
-->

<!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-XXXXXXXXXX', {
    'page_path': window.location.pathname
  });
</script>
